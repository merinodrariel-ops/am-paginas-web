name: Uptime — URLs críticas

# Chequea 2 veces por día que las URLs que sostienen el negocio respondan.
# Si algo falla, el workflow falla → GitHub notifica por email al dueño del repo.
# Nació de un caso real: /llms.txt dio 404 durante días y nadie lo notó.

on:
  schedule:
    - cron: "0 10,22 * * *" # 07:00 y 19:00 hora Argentina
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar URLs críticas
        run: |
          set -e
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -L "$1")
            if [ "$code" = "200" ]; then
              echo "✅ $code  $1"
            else
              echo "❌ $code  $1"
              fail=1
            fi
          }

          # amesteticadental.com — núcleo
          check "https://www.amesteticadental.com/"
          check "https://www.amesteticadental.com/sitemap.xml"
          check "https://www.amesteticadental.com/robots.txt"
          check "https://www.amesteticadental.com/llms.txt"
          check "https://www.amesteticadental.com/casos-antes-y-despues"
          check "https://www.amesteticadental.com/carillas-dentales"
          check "https://www.amesteticadental.com/turismo-dental"
          check "https://www.amesteticadental.com/sonrisa"
          # sitio en inglés (11 páginas)
          check "https://www.amesteticadental.com/en"
          check "https://www.amesteticadental.com/en/dental-tourism-argentina"
          check "https://www.amesteticadental.com/en/porcelain-veneers-buenos-aires"
          check "https://www.amesteticadental.com/en/ultra-thin-veneers-buenos-aires"
          check "https://www.amesteticadental.com/en/smile-design-buenos-aires"
          check "https://www.amesteticadental.com/en/veneers-cost-buenos-aires"
          check "https://www.amesteticadental.com/en/dr-ariel-merino"
          check "https://www.amesteticadental.com/en/before-after"
          check "https://www.amesteticadental.com/en/clinic"
          check "https://www.amesteticadental.com/en/team"
          check "https://www.amesteticadental.com/en/contact"
          check "https://www.amesteticadental.com/en/cosmetic-dentistry-buenos-aires"
          check "https://www.amesteticadental.com/en/invisible-aligners-buenos-aires"
          check "https://www.amesteticadental.com/en/dental-implants-buenos-aires"
          check "https://www.amesteticadental.com/en/teeth-whitening-buenos-aires"
          check "https://www.amesteticadental.com/en/porcelain-vs-composite-veneers"
          check "https://www.amesteticadental.com/en/veneers-vs-aligners"
          check "https://www.amesteticadental.com/en/smile-simulator"
          check "https://www.amesteticadental.com/en/reviews"
          check "https://www.amesteticadental.com/en/blog"
          check "https://www.amesteticadental.com/en/press"
          # amesteticadental.uy — Uruguay
          # Estaba sin vigilar: sus 11 páginas quedaron sin indexar semanas y nadie lo notó.
          check "https://www.amesteticadental.uy/"
          check "https://www.amesteticadental.uy/sitemap.xml"
          check "https://www.amesteticadental.uy/robots.txt"
          check "https://www.amesteticadental.uy/carillas-dentales-montevideo"
          check "https://www.amesteticadental.uy/carillas-de-porcelana-montevideo"
          check "https://www.amesteticadental.uy/diseno-de-sonrisa-montevideo"
          check "https://www.amesteticadental.uy/estetica-dental-montevideo"
          check "https://www.amesteticadental.uy/implantes-dentales-montevideo"
          check "https://www.amesteticadental.uy/blanqueamiento-dental-montevideo"
          check "https://www.amesteticadental.uy/precio-carillas-dentales-montevideo"
          check "https://www.amesteticadental.uy/clinica-dental-carrasco"
          check "https://www.amesteticadental.uy/dr-ariel-merino"
          check "https://www.amesteticadental.uy/financiacion"
          check "https://www.amesteticadental.uy/casos-clinicos"
          check "https://www.amesteticadental.uy/prensa"
          check "https://www.amesteticadental.uy/trabaja-en-am"
          # satélites
          check "https://www.thedentalreview.com/"
          check "https://www.thedentalreview.com/sitemap.xml"
          check "https://www.arielmerino.com/"

          exit $fail
