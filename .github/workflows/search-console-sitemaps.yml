name: Google Search Console — enviar sitemaps

# Google no ofrece indexación instantánea para páginas clínicas normales.
# Este workflow usa la vía soportada: reenviar el sitemap actualizado a Search Console
# después del deploy.

on:
  push:
    branches: [main]
    paths:
      - "amesteticadental/src/data/casos.ts"
      - "amesteticadental/src/data/casosStatic.ts"
      - "amesteticadental/src/app/**/page.tsx"
      - "amesteticadental/src/app/sitemap.ts"
      - "amesteticadental-uy/app/**/page.tsx"
      - "amesteticadental-uy/app/sitemap.ts"
      - "thedentalreview/app/**/page.tsx"
      - "thedentalreview/app/sitemap.ts"
      - "arielmerino/app/**/page.tsx"
      - "arielmerino/app/sitemap.ts"
      - "scripts/submit-google-sitemaps.mjs"
  workflow_dispatch:

concurrency:
  group: google-search-console-sitemaps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      HAS_GSC_SECRETS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Esperar a que Vercel publique la nueva versión
        if: env.HAS_GSC_SECRETS == 'true'
        run: sleep 150

      - name: Enviar sitemaps a Google Search Console
        if: env.HAS_GSC_SECRETS == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/submit-google-sitemaps.mjs

      # Antes esto era un ::warning:: y el job terminaba en verde. Resultado: durante
      # meses figuró "exitoso" sin haberle enviado un solo sitemap a Google, y las
      # páginas de amesteticadental.uy se quedaron sin indexar sin que nadie lo viera.
      # Un workflow que no puede hacer su trabajo tiene que fallar, no tranquilizar.
      - name: Fallar si faltan secretos
        if: env.HAS_GSC_SECRETS != 'true'
        run: |
          echo "::error::No se enviaron los sitemaps a Google: faltan los secretos de Search Console."
          echo ""
          echo "Cargá en Settings → Secrets and variables → Actions:"
          echo "  GOOGLE_SERVICE_ACCOUNT_JSON  (el JSON entero de la cuenta de servicio)"
          echo ""
          echo "La cuenta es indexacion-red-am@am-ads-494903.iam.gserviceaccount.com"
          echo "y tiene que figurar como usuaria de cada propiedad en Search Console."
          exit 1
